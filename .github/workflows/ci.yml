name: Regulatory calculator runtime
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: rbs-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      REGSITE_RNASTRUCTURE: ${{ github.workspace }}/.cache/original/RNAstructure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked development tools and package
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Build separately licensed, pinned RNAstructure executables
        shell: bash
        run: |
          mkdir -p .cache
          curl --fail --location --retry 2 https://rna.urmc.rochester.edu/Releases/rnastructure-6.6/RNAstructureSource.tgz -o .cache/RNAstructureSource.tgz
          python backends/rnastructure66/build.py --archive .cache/RNAstructureSource.tgz --destination .cache/original --jobs 2 --component rnastructure-6.6-original
      - name: Verify every installer branch without compiler subprocesses
        run: |
          python -m coverage run --branch --source=backends/rnastructure66 -m unittest discover -s backends/rnastructure66/tests -p test_build.py -v
          python -m coverage report --include='*/rnastructure66/build.py' --fail-under=100
      - name: Build the separately licensed pinned termination engine
        shell: bash
        run: |
          curl --fail --location --retry 2 --max-time 120 https://transterm.cbcb.umd.edu/transterm_hp_v2.09.zip -o "$RUNNER_TEMP/transterm_hp_v2.09.zip"
          curl --fail --location --retry 2 --max-time 120 https://sources.debian.org/data/main/t/transtermhp/2.09-5/debian/patches/0002-read_seq-return-NULL-instead-of-false.patch -o "$RUNNER_TEMP/transterm-null.patch"
          if [ "$RUNNER_OS" = macOS ]; then
            term_compiler="$(xcrun --find clang++)"
            term_sdk="$(xcrun --show-sdk-path)"
            term_options=(--arch "$(uname -m)" --sysroot "$term_sdk" --cxx-include "$term_sdk/usr/include/c++/v1" --standard-library libc++)
          else
            term_compiler="$(command -v g++)"
            term_options=(--standard-library libstdc++)
          fi
          python tools/build_termination_backend.py --archive "$RUNNER_TEMP/transterm_hp_v2.09.zip" --patch "$RUNNER_TEMP/transterm-null.patch" --compiler "$term_compiler" --output "$RUNNER_TEMP/regsite-termination" "${term_options[@]}"
      - name: Static and full runtime gates
        env:
          REGSITE_TERMINATION_TEST_BACKEND: ${{ runner.temp }}/regsite-termination/backend.json
        run: |
          ruff check src tests experiments tools
          ruff format --check src tests experiments tools
          ruff check benchmarks/rbs/structural.py benchmarks/rbs/new_data.py benchmarks/rbs/wave4_*.py benchmarks/rbs/context_panel.py benchmarks/rbs/context_metrics.py benchmarks/rbs/context_collect.py benchmarks/promoter benchmarks/recoding benchmarks/riboswitch
          ruff format --check benchmarks/rbs/structural.py benchmarks/rbs/new_data.py benchmarks/rbs/wave4_*.py benchmarks/rbs/context_panel.py benchmarks/rbs/context_metrics.py benchmarks/rbs/context_collect.py benchmarks/promoter benchmarks/recoding benchmarks/riboswitch
          mypy src/regsite experiments tools
          python -m pytest --cov=regsite --cov=benchmarks.rbs --cov=benchmarks.promoter --cov=benchmarks.recoding --cov=benchmarks.riboswitch --cov=experiments.rbs --cov=experiments.promoter --cov=tools.derive_promoter_parameters --cov=tools.measure_promoter_resources --cov=tools.calculator_artifacts --cov=tools.build_termination_backend --cov-report=term-missing
          git diff --check
      - name: Build and validate both separately licensed repairs
        shell: bash
        run: |
          python backends/rnastructure66/build.py --archive .cache/RNAstructureSource.tgz --destination .cache/traceback-fixed --jobs 2
          python backends/rnastructure66/build.py --archive .cache/RNAstructureSource.tgz --destination .cache/linker-fixed --jobs 2 --component rnastructure-6.6-linker-3
          export RNASTRUCTURE66_ORIGINAL="$REGSITE_RNASTRUCTURE"
          export RNASTRUCTURE66_PATCHED="$GITHUB_WORKSPACE/.cache/traceback-fixed/RNAstructure"
          export RNASTRUCTURE66_LINKER3="$GITHUB_WORKSPACE/.cache/linker-fixed/RNAstructure"
          python -m unittest discover -s backends/rnastructure66/tests -v
          # The complete suite ran above. Repeat only RBS-dependent tests for
          # backend variants; Promoter/edit/reference tests do not use folding.
          REGSITE_RNASTRUCTURE="$RNASTRUCTURE66_PATCHED" python -m pytest --ignore-glob='tests/test_promoter*' --ignore-glob='tests/benchmarks/test_promoter*' --ignore-glob='tests/benchmarks/test_recoding*' --ignore-glob='tests/benchmarks/test_riboswitch*' --ignore-glob='tests/test_conditional*' --ignore-glob='tests/test_coupling*' --ignore-glob='tests/test_drafting*' --ignore-glob='tests/test_termination*' --ignore-glob='tests/test_jobs*' --ignore=tests/benchmarks/test_wave4_public_receipt.py --cov=regsite.rbs --cov=regsite.backend --cov=regsite.standby --cov=regsite.structures --cov=regsite.native --cov=regsite.native_cli --cov=regsite.cli --cov=regsite.learned --cov=regsite.features --cov-report=term-missing
          REGSITE_RNASTRUCTURE="$RNASTRUCTURE66_LINKER3" python -m pytest --ignore-glob='tests/test_promoter*' --ignore-glob='tests/benchmarks/test_promoter*' --ignore-glob='tests/benchmarks/test_recoding*' --ignore-glob='tests/benchmarks/test_riboswitch*' --ignore-glob='tests/test_conditional*' --ignore-glob='tests/test_coupling*' --ignore-glob='tests/test_drafting*' --ignore-glob='tests/test_termination*' --ignore-glob='tests/test_jobs*' --ignore=tests/benchmarks/test_wave4_public_receipt.py --cov=regsite.rbs --cov=regsite.backend --cov=regsite.standby --cov=regsite.structures --cov=regsite.native --cov=regsite.native_cli --cov=regsite.cli --cov=regsite.learned --cov=regsite.features --cov-report=term-missing
      - name: Build and run fresh offline wheel installation
        shell: bash
        env:
          REGSITE_TERMINATION_TEST_BACKEND: ${{ runner.temp }}/regsite-termination/backend.json
        run: |
          python -m build --no-isolation
          python -m venv .cache/fresh
          .cache/fresh/bin/python -m pip install --no-index --no-deps dist/*.whl
          .cache/fresh/bin/regsite-drafting examples/drafting-single.json > .cache/drafting-single.json
          .cache/fresh/bin/regsite-drafting examples/drafting-batch.json > .cache/drafting-batch.json
          drafting_exit=0
          .cache/fresh/bin/regsite-drafting examples/drafting-unsupported.json > .cache/drafting-unsupported.json || drafting_exit=$?
          test "$drafting_exit" -eq 1
          .cache/fresh/bin/python -c 'import json,math; a=json.load(open(".cache/drafting-single.json")); b=json.load(open(".cache/drafting-batch.json")); c=json.load(open(".cache/drafting-unsupported.json")); assert all(r["schema_version"]=="drafting-result-1" and r["status"]=="complete" and r["model"]["backend"] is None and r["model"]["id"]=="espahborujeni2016-supplied-rate-stationary-1" for r in (a,b)); assert math.isclose(a["records"][0]["throughput"]["quantity"]["value"],10/9,rel_tol=1e-12); assert len(b["records"])==3 and b["records"][1]["occupancies"]["folded"]=={"value":0.0,"ln_value":None,"representation":"exact_zero"}; assert c["status"]=="partial" and c["records"][0]["status"]=="unsupported_domain" and c["records"][0]["throughput"] is None; import hashlib,importlib.metadata as md; h=lambda x: hashlib.sha256(json.dumps(x,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode()).hexdigest(); m={"id":"espahborujeni2016-supplied-rate-stationary-1","implementation_version":md.version("regulatory-site-prediction-reconstruction"),"source_doi":"10.1021/jacs.6b01453","theory_sha256":"a9ded599cbb0313d610267cb9fbdfd21abb1bdb7a467894701fa9b295f3fd6d6","backend":None,"rate_origin":"caller_supplied"}; assert all(r["model"]==m and r["request_sha256"]==h(json.load(open(f"examples/drafting-{n}.json"))) and r["prediction_sha256"]==h({k:v for k,v in r.items() if k!="prediction_sha256"}) for n,r in zip(("single","batch","unsupported"),(a,b,c)))'
          .cache/fresh/bin/regsite-termination examples/termination-single.json --backend-manifest "$REGSITE_TERMINATION_TEST_BACKEND" > .cache/termination-single.json
          .cache/fresh/bin/regsite-termination examples/termination-batch.json --backend-manifest "$REGSITE_TERMINATION_TEST_BACKEND" > .cache/termination-batch.json
          termination_exit=0
          .cache/fresh/bin/regsite-termination examples/termination-unsupported.json --backend-manifest "$REGSITE_TERMINATION_TEST_BACKEND" > .cache/termination-unsupported.json || termination_exit=$?
          test "$termination_exit" -eq 1
          .cache/fresh/bin/python -c 'import json; a=json.load(open(".cache/termination-single.json")); b=json.load(open(".cache/termination-batch.json")); c=json.load(open(".cache/termination-unsupported.json")); assert all(r["schema_version"]=="termination-result-1" and r["status"]=="complete" and r["coverage"]["retained_candidates"]==1 for r in (a,b)); assert c["status"]=="partial" and all(r["candidates"] is None for r in c["records"]); assert all(r["prediction_sha256"] and r["result_sha256"] for r in (a,b,c)); tie=[(x["hairpin"]["start"],x["hairpin"]["end"],x["strand"],x["confidence"],x["hairpin_score"],x["tail_score"]) for x in a["records"][0]["candidates"]]; assert tie==[(70,86,"+",78,"-11.8","-3.87583")]; assert b["records"][0]["candidates"]==a["records"][0]["candidates"] and b["records"][1]["status"]=="ok" and b["records"][1]["candidates"]==[]; assert [r["reason"] for r in c["records"]]==["no_search_positions","uniform_background"] and not any(r["attempted"] for r in c["records"])'
          .cache/fresh/bin/regsite-coupling examples/coupling-single.json > .cache/coupling-single.json
          .cache/fresh/bin/regsite-coupling examples/coupling-batch.json > .cache/coupling-batch.json
          coupling_exit=0
          .cache/fresh/bin/regsite-coupling examples/coupling-unsupported.json > .cache/coupling-unsupported.json || coupling_exit=$?
          test "$coupling_exit" -eq 1
          .cache/fresh/bin/python -c 'import json,math; a=json.load(open(".cache/coupling-single.json")); b=json.load(open(".cache/coupling-batch.json")); c=json.load(open(".cache/coupling-unsupported.json")); assert all(r["schema_version"]=="coupling-result-1" and r["status"]=="complete" and r["model"]["backend"] is None for r in (a,b)); assert math.isclose(a["records"][0]["scores"]["downstream_total"]["value"],1.072); assert len(b["records"])==3; assert all(math.isclose(r["scores"]["downstream_total"]["value"],1.22) for r in b["records"][1:]); assert c["status"]=="partial" and c["records"][0]["status"]=="unsupported_distance" and c["records"][0]["scores"] is None'
          # CI explicitly keeps disposable outputs in its checkout; ordinary
          # campaigns default to external storage. Resume must not rerun jobs.
          .cache/fresh/bin/regsite-jobs run --manifest "$GITHUB_WORKSPACE/examples/jobs-synthetic/manifest.json" --output-dir "$GITHUB_WORKSPACE/.cache/jobs-synthetic" --allow-repository-output > .cache/jobs-synthetic-run.json
          .cache/fresh/bin/regsite-jobs verify --manifest "$GITHUB_WORKSPACE/examples/jobs-synthetic/manifest.json" --output-dir "$GITHUB_WORKSPACE/.cache/jobs-synthetic" > .cache/jobs-synthetic-verify.json
          .cache/fresh/bin/regsite-jobs resume --manifest "$GITHUB_WORKSPACE/examples/jobs-synthetic/manifest.json" --output-dir "$GITHUB_WORKSPACE/.cache/jobs-synthetic" --allow-repository-output > .cache/jobs-synthetic-resume.json
          .cache/fresh/bin/regsite-jobs run --manifest "$GITHUB_WORKSPACE/examples/jobs-backend/manifest.json" --output-dir "$GITHUB_WORKSPACE/.cache/jobs-backend" --backend-root "$GITHUB_WORKSPACE/.cache/linker-fixed/RNAstructure" --allow-repository-output > .cache/jobs-backend-run.json
          .cache/fresh/bin/regsite-jobs verify --manifest "$GITHUB_WORKSPACE/examples/jobs-backend/manifest.json" --output-dir "$GITHUB_WORKSPACE/.cache/jobs-backend" > .cache/jobs-backend-verify.json
          .cache/fresh/bin/python -c 'import json; from pathlib import Path; cases=[("synthetic", "run", 2), ("synthetic", "verify", 2), ("synthetic", "resume", 2), ("backend", "run", 3), ("backend", "verify", 3)]; results=[(json.loads(Path(f".cache/jobs-{kind}-{action}.json").read_text()), count) for kind,action,count in cases]; assert all(r["status"]=="complete" and r["counts"]["succeeded"]==n and r["attempts"]==n for r,n in results); assert len({r["campaign_sha256"] for r,n in results[:3]})==1'
          # Scalar conditional inference is portable and uses no folding engine.
          # Exact original arm64 structural admission has a separate local receipt.
          .cache/fresh/bin/regsite-conditional examples/conditional-supplied-half-occupancy.json > .cache/conditional-fraction.json
          .cache/fresh/bin/regsite-conditional examples/conditional-supplied-volume-fifth.json > .cache/conditional-volume.json
          .cache/fresh/bin/python -c 'import json,math; a=json.load(open(".cache/conditional-fraction.json")); b=json.load(open(".cache/conditional-volume.json")); assert all(r["status"]=="ok" and r["complete"] and r["model"]["backend"] is None for r in (a,b)); assert math.isclose(a["response"]["ar_actual"],2.5,rel_tol=1e-12); assert math.isclose(b["response"]["ar_actual"],8/7,rel_tol=1e-12)'
          REGSITE_RNASTRUCTURE="$GITHUB_WORKSPACE/.cache/linker-fixed/RNAstructure" .cache/fresh/bin/regsite-transcript examples/supplied-transcript-single.json > .cache/transcript-single.json
          REGSITE_RNASTRUCTURE="$GITHUB_WORKSPACE/.cache/linker-fixed/RNAstructure" .cache/fresh/bin/regsite-transcript examples/supplied-transcript-two-cds.json > .cache/transcript-two.json
          REGSITE_RNASTRUCTURE="$GITHUB_WORKSPACE/.cache/linker-fixed/RNAstructure" .cache/fresh/bin/regsite-transcript examples/supplied-transcript-two-cds.json --format csv > .cache/transcript-two.csv
          # An incompatible annotation remains explicit, with a partial-result exit.
          transcript_exit=0
          REGSITE_RNASTRUCTURE="$GITHUB_WORKSPACE/.cache/linker-fixed/RNAstructure" .cache/fresh/bin/regsite-transcript examples/supplied-transcript-incompatible.json > .cache/transcript-incompatible.json || transcript_exit=$?
          test "$transcript_exit" -eq 1
          .cache/fresh/bin/python -c 'import csv,json; a=json.load(open(".cache/transcript-single.json")); b=json.load(open(".cache/transcript-two.json")); c=json.load(open(".cache/transcript-incompatible.json")); assert all(r["schema_version"]=="supplied-transcript-result-1" and r["status"]=="complete" and r["coverage"]["complete"] for r in (a,b)); assert b["components"]["rbs"]["coverage"]["requested"]==2; assert c["status"]=="partial" and c["cds"][0]["status"]=="incompatible_transcript"; rows=list(csv.DictReader(open(".cache/transcript-two.csv"))); assert sum(r["row_type"]=="component" for r in rows)==2; assert all(r["prediction_sha256"]==b["prediction_sha256"] for r in rows)'
          .cache/fresh/bin/regsite-compare examples/paired-promoter-unchanged.json > .cache/paired-unchanged.json
          .cache/fresh/bin/regsite-compare examples/paired-promoter-indel.json > .cache/paired-indel.json
          .cache/fresh/bin/regsite-compare examples/paired-promoter-indel.json --format csv > .cache/paired.csv
          REGSITE_RNASTRUCTURE="$GITHUB_WORKSPACE/.cache/linker-fixed/RNAstructure" .cache/fresh/bin/regsite-compare examples/paired-rbs-substitution.json > .cache/paired-rbs.json
          .cache/fresh/bin/python -c 'import csv,json; a=json.load(open(".cache/paired-unchanged.json")); b=json.load(open(".cache/paired-indel.json")); c=json.load(open(".cache/paired-rbs.json")); assert all(r["schema_version"]=="paired-regulatory-result-1" and r["status"]=="complete" and r["coverage"]["complete"] for r in (a,b,c)); assert all(v["value"]==0 for row in a["comparisons"] for v in row["deltas"].values()); rows=list(csv.DictReader(open(".cache/paired.csv"))); assert len(rows)==24 and all(row["prediction_sha256"]==b["prediction_sha256"] for row in rows); assert c["sides"]["current"]["prediction"]["backend"]["variant"]=="rnastructure-6.6-linker-3"'
          .cache/fresh/bin/regsite-promoter examples/promoter-contract-single.json > .cache/promoter-single.json
          .cache/fresh/bin/regsite-promoter examples/promoter-contract-batch.json > .cache/promoter-batch.json
          .cache/fresh/bin/regsite-promoter examples/promoter-projected.json --format csv > .cache/promoter.csv
          .cache/fresh/bin/regsite-promoter examples/promoter-projected.json --format gff3 > .cache/promoter.gff3
          .cache/fresh/bin/python -c 'import json; a=json.load(open(".cache/promoter-single.json")); b=json.load(open(".cache/promoter-batch.json")); assert a["results"][0]["status"]=="ok"; assert a["model"]["id"]=="promoter-lafleur2022-historical-1"; assert [r["status"] for r in b["results"]]==["ok","no_candidate"]; assert open(".cache/promoter.gff3").readline()=="##gff-version 3\n"'
          .cache/fresh/bin/regsite examples/rbs-single.json > .cache/single.json
          .cache/fresh/bin/regsite examples/rbs-batch.json > .cache/batch.json
          .cache/fresh/bin/regsite examples/rbs-batch.json --format csv > .cache/batch.csv
          .cache/fresh/bin/regsite examples/rbs-footprint.json --profile footprint2017 > .cache/footprint.json
          .cache/fresh/bin/regsite examples/rbs-footprint.json --profile context2017 > .cache/context.json
          .cache/fresh/bin/regsite examples/rbs-standby-hairpin.json --profile standby2014 > .cache/standby-original.json
          REGSITE_RNASTRUCTURE="$GITHUB_WORKSPACE/.cache/traceback-fixed/RNAstructure" .cache/fresh/bin/regsite examples/rbs-standby-hairpin.json --profile standby2014 > .cache/standby-fixed.json
          REGSITE_RNASTRUCTURE="$GITHUB_WORKSPACE/.cache/traceback-fixed/RNAstructure" .cache/fresh/bin/regsite examples/rbs-batch.json --profile standby2014 > .cache/standby-batch.json
          .cache/fresh/bin/regsite examples/rbs-standby-hairpin.json --profile standby2014 --format csv > .cache/standby.csv
          REGSITE_RNASTRUCTURE="$GITHUB_WORKSPACE/.cache/traceback-fixed/RNAstructure" .cache/fresh/bin/regsite-native examples/rbs-native-karlsen.json --profile standby2014 > .cache/native-standby.json
          .cache/fresh/bin/regsite examples/rbs-standby-hairpin.json --profile joint_standby > .cache/joint-original.json
          REGSITE_RNASTRUCTURE="$GITHUB_WORKSPACE/.cache/traceback-fixed/RNAstructure" .cache/fresh/bin/regsite examples/rbs-standby-hairpin.json --profile joint_standby > .cache/joint-fixed.json
          .cache/fresh/bin/regsite examples/rbs-batch.json --profile joint_standby > .cache/joint-batch.json
          .cache/fresh/bin/regsite examples/rbs-standby-hairpin.json --profile joint_standby --format csv > .cache/joint.csv
          REGSITE_RNASTRUCTURE="$GITHUB_WORKSPACE/.cache/traceback-fixed/RNAstructure" .cache/fresh/bin/regsite-native examples/rbs-native-karlsen.json --profile joint_standby > .cache/native-joint.json
          REGSITE_RNASTRUCTURE="$GITHUB_WORKSPACE/.cache/linker-fixed/RNAstructure" .cache/fresh/bin/regsite examples/rbs-standby-hairpin.json --profile joint_standby > .cache/joint-linker.json
          REGSITE_RNASTRUCTURE="$GITHUB_WORKSPACE/.cache/linker-fixed/RNAstructure" .cache/fresh/bin/regsite examples/rbs-batch.json --profile joint_standby --format csv > .cache/joint-linker-batch.csv
          REGSITE_RNASTRUCTURE="$GITHUB_WORKSPACE/.cache/linker-fixed/RNAstructure" .cache/fresh/bin/regsite-native examples/rbs-native-karlsen.json --profile joint_standby > .cache/native-joint-linker.json
          .cache/fresh/bin/regsite-native benchmarks/rbs/native-input-example.json > .cache/native.json
          .cache/fresh/bin/regsite-native benchmarks/rbs/native-input-example.json --format gff3 > .cache/native.gff3
          .cache/fresh/bin/regsite-native examples/rbs-native-karlsen.json > .cache/native-real.json
          .cache/fresh/bin/regsite-native examples/rbs-native-karlsen.json --format gff3 > .cache/native-real.gff3
          .cache/fresh/bin/regsite-learned models/rbs/standby2014/sequence-v1.json examples/rbs-learned.json > .cache/learned-sequence.json
          .cache/fresh/bin/regsite-learned models/rbs/standby2014/context-energy-sequence-v1.json examples/rbs-learned.json > .cache/learned-energy.json
          .cache/fresh/bin/regsite-learned models/rbs/karlsen2018/sequence-v1.json examples/rbs-karlsen-native.json > .cache/learned-native.json
          .cache/fresh/bin/python -c 'import json; a=json.load(open(".cache/single.json")); b=json.load(open(".cache/batch.json")); assert a["results"][0]["status"]=="ok"; assert [r["status"] for r in b["results"]]==["ok","ok","no_candidate","unsupported"]'
          .cache/fresh/bin/python -c 'import json; a=json.load(open(".cache/footprint.json")); b=json.load(open(".cache/context.json")); assert a["schema_version"]==b["schema_version"]=="1.1"; assert a["results"][0]["status"]==b["results"][0]["status"]=="ok"'
          .cache/fresh/bin/python -c 'import json; a=json.load(open(".cache/standby-original.json")); b=json.load(open(".cache/standby-fixed.json")); c=json.load(open(".cache/standby-batch.json")); assert a["schema_version"]==b["schema_version"]=="1.2"; assert a["results"][0]["status"]==b["results"][0]["status"]=="ok"; assert b["results"][0]["backend"]["variant"]=="rnastructure-6.6-traceback-2"; assert [r["status"] for r in c["results"]]==["ok","ok","no_candidate","unsupported"]'
          .cache/fresh/bin/python -c 'import json; a=json.load(open(".cache/native.json")); assert a["schema_version"]=="native-rbs-result-1"; assert len(a["results"])==7; assert a["results"][-1]["reason"]=="tss_inside_current_cds"; assert open(".cache/native.gff3").readline()=="##gff-version 3\n"'
          .cache/fresh/bin/python -c 'import json; a=json.load(open(".cache/native-real.json")); assert [r["status"] for r in a["results"]]==["ok","ok"]; rows=[l.split("\t") for l in open(".cache/native-real.gff3") if not l.startswith("#")]; assert [(r[3],r[4],r[6]) for r in rows if r[2]=="start_codon"]==[("383817","383819","+"),("745062","745064","-")]'
          .cache/fresh/bin/python -c 'import json; a=json.load(open(".cache/learned-sequence.json")); b=json.load(open(".cache/learned-energy.json")); assert a["results"][0]["status"]==b["results"][0]["status"]=="ok"; assert a["results"][0]["mechanistic_reference"] is None; assert b["results"][0]["mechanistic_reference"]["backend"]["version"]=="6.6"'
          .cache/fresh/bin/python -c 'import json; a=json.load(open(".cache/learned-native.json"))["results"][0]; assert a["status"]=="ok"; assert a["mechanistic_reference"] is None; assert "outside_declared_training_host_or_settings" not in a["warnings"]'
          .cache/fresh/bin/python -c 'import csv,json; r=next(csv.DictReader(open(".cache/standby.csv"))); assert r["schema_version"]=="1.2" and r["status"]=="ok"; a=json.load(open(".cache/native-standby.json")); assert [r["status"] for r in a["results"]]==["ok","ok"]; assert all(r["prediction"]["schema_version"]=="1.2" and "standby_module" in r["genomic_sites"][0] for r in a["results"])'
          .cache/fresh/bin/python -c 'import json; a=json.load(open(".cache/joint-original.json")); b=json.load(open(".cache/joint-fixed.json")); c=json.load(open(".cache/joint-batch.json")); assert a["schema_version"]==b["schema_version"]=="1.3"; assert all(r["status"]=="ok" and r["sites"][0]["joint_search"]["complete"] for x in (a,b) for r in x["results"]); assert [r["status"] for r in c["results"]]==["ok","ok","no_candidate","unsupported"]'
          .cache/fresh/bin/python -c 'import csv,json; r=next(csv.DictReader(open(".cache/joint.csv"))); assert r["schema_version"]=="1.3" and r["status"]=="ok"; a=json.load(open(".cache/native-joint.json")); assert [r["status"] for r in a["results"]]==["ok","ok"]; assert all(r["prediction"]["schema_version"]=="1.3" and "standby_module" in r["genomic_sites"][0] for r in a["results"])'
          .cache/fresh/bin/python -c 'import csv,json; a=json.load(open(".cache/joint-linker.json")); b=json.load(open(".cache/native-joint-linker.json")); c=list(csv.DictReader(open(".cache/joint-linker-batch.csv"))); assert a["results"][0]["backend"]["variant"]=="rnastructure-6.6-linker-3"; assert a["results"][0]["status"]=="ok"; assert [r["status"] for r in b["results"]]==["ok","ok"]; assert all(r["prediction"]["backend"]["variant"]=="rnastructure-6.6-linker-3" for r in b["results"]); assert [r["status"] for r in c]==["ok","ok","no_candidate","unsupported"]'

      - name: Show bounded smoke diagnostics on failure
        if: failure()
        shell: bash
        run: |
          python - <<'PYDIAGNOSTICS'
          from pathlib import Path
          paths = sorted(Path(".cache").glob("*.json"), key=lambda p: p.stat().st_mtime, reverse=True)[:16]
          for path in paths:
              print(f"--- {str(path)[:256]} (first 4096 bytes) ---")
              try:
                  with path.open("rb") as stream:
                      print(stream.read(4096).decode("utf-8", errors="replace"))
              except OSError as error:
                  print(f"unreadable: {type(error).__name__}")
          PYDIAGNOSTICS
  promoter-resources:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Measure and admit the complete synthetic candidate suite
        env:
          PYTHONPATH: src:.
        run: >-
          python tools/measure_promoter_resources.py
          --suite candidate --repetitions 3 --budget-seconds 1200 --admit
          --output .cache/promoter-resources/ci.json
      - name: Preserve the complete resource receipt, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promoter-resources-${{ matrix.os }}-py${{ matrix.python }}
          path: .cache/promoter-resources/ci.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
